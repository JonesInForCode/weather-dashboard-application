<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Dashboard</h1>
            <div class="search-container">
                <input type="text" id="location-input" placeholder="Enter city name">
                <button id="search-btn">Search</button>

            </div>
        </header>

        <main>
            <section id="current-weather" class="weather-panel">
                <!-- Current weather will be inserted here -->
            </section>

            <section id="forecast" class="forecast-panel">
                <!-- Forecast will be inserted here -->

            </section>

            <section id="favorites" class="favorites-panel">
                <h2>Favorie Locations</h2>
                <ul id="favorites-list"></ul>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
